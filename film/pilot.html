<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Joy Plant Pilot</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Vice & Versa — Chapter One pilot (cold open + Scene 3).
// Deterministic: renderAt(t) draws the frame at t seconds. No real-time clock.
// ---------------------------------------------------------------------------
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const P = new URLSearchParams(location.search);
const SHOW_CAPTIONS = P.get('captions') !== '0';

const C = {
  ground: '#15120f', ground2: '#1d1915',
  paper: '#e8dcc2', paperDark: '#cdbd9c', ink: '#2a211a',
  clay: '#a9825a', clayDark: '#7d5c3c', clayLight: '#c9a47a',
  red: '#A32A1E', warm: '#e0a64a', sick: '#8fa33a',
  text: '#efe6d3', dim: '#8d8272',
};
const SERIF = '"EB Garamond", Georgia, serif';
const MONO = '"IBM Plex Mono", monospace';
const SANS = 'Inter, sans-serif';

// ---- utils ----------------------------------------------------------------
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = Math.imul(s ^ (s >>> 15), 1 | s) + 0x6D2B79F5 >>> 0, s = (s ^ (s + Math.imul(s ^ (s >>> 7), 61 | s))) >>> 0), ((s ^ (s >>> 14)) >>> 0) / 4294967296); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a));           // 0→1 between a and b
const fade = (t, a, d = .5) => easeOut(ramp(t, a, a + d));
// "boil": cut-out figures twitch slightly at 8 fps, like stop-motion paper.
function boil(t, seed, amp = 1.2) { const f = Math.floor(t * 8); const r = rng(seed * 7919 + f); return [(r() - .5) * 2 * amp, (r() - .5) * 2 * amp, (r() - .5) * .006 * amp]; }

// ---- textures -------------------------------------------------------------
function makeGrain(w, h, seed, dens, light) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const r = rng(seed);
  const img = g.createImageData(w, h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = r(); const a = v < dens ? 255 * (0.25 + r() * 0.5) : 0;
    const col = light ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = col; d[i + 3] = a * 0.35;
  }
  g.putImageData(img, 0, 0);
  // fibres
  g.globalAlpha = 0.06; g.strokeStyle = light ? '#fff' : '#000'; g.lineWidth = 1;
  for (let i = 0; i < w * h / 9000; i++) { const x = r() * w, y = r() * h, a = r() * 6.28, l = 6 + r() * 30; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l / 2, y + Math.sin(a + 1) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  return c;
}
const GRAIN_DARK = makeGrain(960, 540, 11, 0.10, true);   // specks on the dark ground
const GRAIN_PAPER = makeGrain(700, 700, 23, 0.22, false); // darker specks for paper/clay
const VIGNETTE = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); const gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();

function ground(t, col = C.ground) {
  ctx.fillStyle = col; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(t * 8) % 4; // shift grain slowly — film-like
  ctx.globalAlpha = 0.5; ctx.drawImage(GRAIN_DARK, -f * 7, -f * 5, W + 40, H + 40); ctx.globalAlpha = 1;
}
function vignette() { ctx.drawImage(VIGNETTE, 0, 0); }

// A rough-edged "cut paper" polygon approximating a rectangle.
function roughRect(x, y, w, h, seed, j = 2.2) {
  const r = rng(seed); const pts = [];
  const side = (x0, y0, x1, y1) => { const n = Math.max(3, Math.round(Math.hypot(x1 - x0, y1 - y0) / 40)); for (let i = 0; i < n; i++) { const k = i / n; pts.push([lerp(x0, x1, k) + (r() - .5) * j, lerp(y0, y1, k) + (r() - .5) * j]); } };
  side(x, y, x + w, y); side(x + w, y, x + w, y + h); side(x + w, y + h, x, y + h); side(x, y + h, x, y);
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
}
function paperFill(fill, grainAlpha = .5) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  ctx.save(); ctx.clip(); ctx.globalAlpha = grainAlpha; ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = ctx.createPattern(GRAIN_PAPER, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
}
function card(x, y, w, h, seed, fill = C.paper, grain = .5) { roughRect(x, y, w, h, seed); paperFill(fill, grain); }

// ---- text -----------------------------------------------------------------
function font(size, fam = SERIF, weight = 400, style = 'normal') { ctx.font = `${style} ${weight} ${size}px ${fam}`; }
function wrap(text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function textC(s, x, y, col = C.text, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }
function textL(s, x, y, col = C.text, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); }

// ---- the red line: hand-drawn strike, drawn progressively -------------------
function strike(x0, y0, x1, y1, p, seed, width = 8, col = C.red) {
  if (p <= 0) return; const r = rng(seed); const n = 24; const pts = [];
  for (let i = 0; i <= n; i++) { const k = i / n; pts.push([lerp(x0, x1, k) + (r() - .5) * 3, lerp(y0, y1, k) + Math.sin(k * 3.1 + seed) * 3 + (r() - .5) * 2.5]); }
  const m = Math.max(1, Math.floor(n * clamp(p))); const frac = n * clamp(p) - m;
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [lw, a] of [[width, .95], [width * .45, .5]]) {
    ctx.lineWidth = lw; ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1] + (lw < width ? -1.5 : 0));
    for (let i = 1; i <= m; i++) ctx.lineTo(pts[i][0], pts[i][1] + (lw < width ? -1.5 : 0));
    if (m < n && frac > 0) ctx.lineTo(lerp(pts[m][0], pts[m + 1][0], frac), lerp(pts[m][1], pts[m + 1][1], frac));
    ctx.stroke();
  }
  ctx.restore();
}
// hand-drawn circle (used for emphasis)
function ring(cx, cy, rx, ry, p, seed) {
  if (p <= 0) return; const r = rng(seed); ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
  const n = 60, end = 1.12 * clamp(p);
  for (let i = 0; i <= n * end; i++) { const a = -2.2 + i / n * 6.283; const j = 1 + (r() - .5) * .03 + i / n * .05; const x = cx + Math.cos(a) * rx * j, y = cy + Math.sin(a) * ry * j; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.restore();
}

// ---- lower third citation -----------------------------------------------
function lowerThird(s, t, a0, a1) {
  const a = fade(t, a0, .5) * (1 - fade(t, a1 - .5, .5)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; font(30, SERIF, 400, 'italic');
  const w = ctx.measureText(s).width; const x = 120, y = 880;
  ctx.fillStyle = 'rgba(15,12,10,.72)'; ctx.fillRect(x - 24, y - 44, w + 60, 64);
  ctx.fillStyle = C.red; ctx.fillRect(x - 24, y - 44, 5, 64);
  textL(s, x + 6, y, C.text); ctx.restore();
}

// ---- illustrations --------------------------------------------------------
function poppy(x, y, s, t, seed, grey = 0) {
  const [bx, by, br] = boil(t, seed); ctx.save(); ctx.translate(x + bx, y + by); ctx.rotate(br); ctx.scale(s, s);
  const petal = grey ? '#6d625a' : '#c0392b', petal2 = grey ? '#5b514a' : '#9e2a1f';
  ctx.strokeStyle = grey ? '#4e5a45' : '#4f7a3a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.bezierCurveTo(10, 120, -18, 200, 6, 300); ctx.stroke();
  const pet = (a, c) => { ctx.save(); ctx.rotate(a); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-70, -20, -80, -110, -10, -118); ctx.bezierCurveTo(50, -120, 75, -30, 0, 0); ctx.fill(); ctx.restore(); };
  pet(-.9, petal2); pet(.9, petal2); pet(-.35, petal); pet(.35, petal);
  ctx.fillStyle = '#1b1411'; ctx.beginPath(); ctx.arc(0, -8, 22, 0, 6.28); ctx.fill();
  ctx.fillStyle = grey ? '#555' : '#6c7a3c'; ctx.beginPath(); ctx.ellipse(0, -14, 12, 9, 0, 0, 6.28); ctx.fill();
  ctx.restore();
}
// Colocynth: round, mottled green-and-cream gourd, small stalk.
function gourd(x, y, s, t, seed, rot = 0) {
  const [bx, by, br] = boil(t, seed); ctx.save(); ctx.translate(x + bx, y + by); ctx.rotate(rot + br); ctx.scale(s, s);
  const R = 60;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#6f8a3a'; ctx.beginPath(); ctx.ellipse(0, 0, R * 1.04, R, 0, 0, 6.28); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, R * 1.04, R, 0, 0, 6.28); ctx.clip();
  const r = rng(seed);
  for (let i = 0; i < 9; i++) { // pale mottled stripes, pole to pole
    const a = -1.2 + i * .3; ctx.strokeStyle = 'rgba(226,220,160,.55)'; ctx.lineWidth = 7 + r() * 5; ctx.beginPath();
    for (let k = 0; k <= 12; k++) { const yy = -R + k / 12 * 2 * R; const xx = Math.sin(a) * Math.sqrt(Math.max(0, R * R - yy * yy)) * 1.04 + (r() - .5) * 5; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(40,55,20,.35)'; for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.ellipse((r() - .5) * 2 * R, (r() - .5) * 2 * R, 3 + r() * 7, 2 + r() * 4, r() * 3, 0, 6.28); ctx.fill(); }
  const hl = ctx.createRadialGradient(-22, -26, 4, -10, -10, R * 1.3); hl.addColorStop(0, 'rgba(255,255,220,.35)'); hl.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = hl; ctx.fillRect(-R * 1.2, -R * 1.2, R * 2.4, R * 2.4);
  ctx.globalAlpha = .45; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = ctx.createPattern(GRAIN_PAPER, 'repeat'); ctx.fillRect(-R * 1.2, -R * 1.2, R * 2.4, R * 2.4);
  ctx.restore();
  ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -R + 4); ctx.quadraticCurveTo(6, -R - 14, 18, -R - 20); ctx.stroke();
  ctx.restore();
}
function tablet(x, y, w, h, t, seed, opts = {}) {
  const [bx, by, br] = boil(t, seed, .8); ctx.save(); ctx.translate(x + bx, y + by); ctx.rotate(br + (opts.rot || 0));
  // pillowy clay tablet
  ctx.beginPath(); const rr = Math.min(w, h) * .18; ctx.roundRect(-w / 2, -h / 2, w, h, rr);
  paperFill(opts.fill || C.clay, .7);
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, 'rgba(255,230,190,.22)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, rr); ctx.fillStyle = g; ctx.fill();
  if (opts.marks !== false) { // proto-cuneiform style numeral impressions: circles and D-shapes in ruled cases
    const r = rng(seed + 5); const rows = opts.rows || 3; const pad = w * .1;
    ctx.strokeStyle = 'rgba(60,40,25,.55)'; ctx.lineWidth = 2;
    for (let i = 1; i < rows; i++) { const yy = -h / 2 + i * h / rows; ctx.beginPath(); ctx.moveTo(-w / 2 + pad * .6, yy); ctx.lineTo(w / 2 - pad * .6, yy); ctx.stroke(); }
    for (let i = 0; i < rows; i++) {
      const cy = -h / 2 + (i + .5) * h / rows; let cx = -w / 2 + pad; const n = 2 + Math.floor(r() * 4); const sz = Math.min(h / rows * .28, w * .06);
      for (let k = 0; k < n; k++) { impress(cx, cy, sz, r() < .5); cx += sz * 2.6; }
    }
  }
  ctx.restore();
}
function impress(x, y, s, round) {
  ctx.save(); ctx.fillStyle = 'rgba(55,35,20,.55)';
  ctx.beginPath(); if (round) ctx.arc(x, y, s, 0, 6.28); else { ctx.ellipse(x, y, s * 1.3, s * .8, 0, Math.PI * .5, Math.PI * 1.5, true); ctx.closePath(); } ctx.fill();
  ctx.strokeStyle = 'rgba(255,225,180,.3)'; ctx.lineWidth = 1.5; ctx.beginPath(); if (round) ctx.arc(x + 1, y + 1, s, .2, 2.2); else ctx.ellipse(x + 1, y + 1, s * 1.3, s * .8, 0, -.2, 1.4); ctx.stroke(); ctx.restore();
}
function jar(x, y, s, t, seed, fill = C.clay) {
  const [bx, by, br] = boil(t, seed); ctx.save(); ctx.translate(x + bx, y + by); ctx.rotate(br); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-28, -120); ctx.lineTo(28, -120); ctx.lineTo(24, -100); ctx.bezierCurveTo(95, -80, 95, 40, 40, 110); ctx.lineTo(-40, 110); ctx.bezierCurveTo(-95, 40, -95, -80, -24, -100); ctx.closePath();
  paperFill(fill, .7);
  ctx.strokeStyle = 'rgba(60,35,20,.4)'; ctx.lineWidth = 3; for (const yy of [-60, -40]) { ctx.beginPath(); ctx.moveTo(-70, yy); ctx.quadraticCurveTo(0, yy + 10, 70, yy); ctx.stroke(); }
  ctx.restore();
}
function pyramidDusk(t, a) {
  ctx.save(); ctx.globalAlpha = a;
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#1b1a2c'); sky.addColorStop(.55, '#6b3a2e'); sky.addColorStop(.75, '#c9774a'); sky.addColorStop(1, '#3a2418');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,200,140,.6)'; ctx.beginPath(); ctx.arc(1320, 760, 60, 0, 6.28); ctx.fill();
  const tri = (cx, base, hw, hh, col, seed) => { const [bx, by] = boil(t, seed, .8); ctx.beginPath(); ctx.moveTo(cx - hw + bx, base + by); ctx.lineTo(cx + bx, base - hh + by); ctx.lineTo(cx + hw + bx, base + by); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); };
  tri(1500, 860, 150, 150, '#2a1c16', 3); tri(700, 860, 380, 380, '#1f1511', 1); tri(1150, 860, 300, 300, '#241813', 2);
  ctx.fillStyle = '#140d0a'; ctx.fillRect(0, 855, W, H);
  ctx.globalAlpha = a * .35; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = ctx.createPattern(GRAIN_PAPER, 'repeat'); ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function grainIcon(x, y, s, col = C.ink) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(0, -34); ctx.stroke(); for (let i = 0; i < 5; i++) { const yy = 20 - i * 12; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 7, yy - 4, 4, 9, sd * .5, 0, 6.28); ctx.fill(); } } ctx.restore(); }
function sheepIcon(x, y, s, col = C.ink) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, 36, 22, 0, 0, 6.28); ctx.fill(); ctx.beginPath(); ctx.ellipse(36, -12, 12, 9, -.5, 0, 6.28); ctx.fill(); ctx.fillRect(-24, 12, 6, 24); ctx.fillRect(18, 12, 6, 24); ctx.restore(); }
function storehouse(x, y, s, t) {
  const [bx, by] = boil(t, 77, .7); ctx.save(); ctx.translate(x + bx, y + by); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-130, -20); ctx.lineTo(0, -120); ctx.lineTo(130, -20); ctx.lineTo(110, -20); ctx.lineTo(110, 120); ctx.lineTo(-110, 120); ctx.lineTo(-110, -20); ctx.closePath(); paperFill(C.clayDark, .6);
  ctx.fillStyle = '#1a120c'; ctx.beginPath(); ctx.roundRect(-35, 30, 70, 90, [35, 35, 0, 0]); ctx.fill(); ctx.restore();
}
// Book spine / title card / generic web page — the sentence repeated everywhere. No real logos.
const SHORT = 'The Sumerians referred to it as Hul Gil, the “joy plant.”';
function spine(x, y, h, t, seed, col) {
  const [bx, by] = boil(t, seed, .6); ctx.save(); ctx.translate(x + bx, y + by);
  card(-26, -h / 2, 52, h, seed, col, .5); ctx.rotate(-Math.PI / 2); font(18, SERIF, 600); textC('“the joy plant”', 0, 6, '#f0e3c6'); ctx.restore();
}
function webBox(x, y, w, t, seed) {
  const [bx, by] = boil(t, seed, .6); ctx.save(); ctx.translate(x + bx, y + by);
  card(0, 0, w, w * .55, seed, '#dcd6cc', .3); ctx.fillStyle = '#8a857c'; ctx.fillRect(4, 4, w - 8, 18);
  for (let i = 0; i < 3; i++) { ctx.fillStyle = ['#b34', '#ca5', '#5a5'][i]; ctx.beginPath(); ctx.arc(16 + i * 14, 13, 4, 0, 6.28); ctx.fill(); }
  font(Math.round(w / 17), SERIF); ctx.fillStyle = C.ink; wrap(SHORT, w - 30).forEach((l, i) => textL(l, 15, 52 + i * w / 14, C.ink)); ctx.restore();
}
function titleCard(x, y, w, t, seed) {
  const [bx, by] = boil(t, seed, .6); ctx.save(); ctx.translate(x + bx, y + by);
  card(0, 0, w, w * .5, seed, '#231d18', .2); font(Math.round(w / 13), SERIF, 400, 'italic');
  wrap('Hul Gil, the “joy plant.”', w - 30).forEach((l, i) => textC(l, w / 2, w * .22 + i * w / 11, C.text)); ctx.restore();
}

// ---------------------------------------------------------------------------
// TIMELINE. Each shot = narration lines + a draw function.
// Guide timing: 150 wpm → 0.4 s per word, plus a pause after each line.
// ---------------------------------------------------------------------------
const SPW = 0.4;
const words = s => s.trim().split(/\s+/).length;

const CHIPS = ['3400 B.C.', 'The Sumerians', '“joy plant”', 'opium poppy'];
// chip layout: mode 0 = big centre row, 1 = small strip at top
function chipBoxes(mode) {
  const size = mode ? 30 : 54; font(size, SERIF, 600); const pad = mode ? 22 : 34, gap = mode ? 22 : 40;
  const ws = CHIPS.map(s => ctx.measureText(s).width + pad * 2); const total = ws.reduce((a, b) => a + b) + gap * 3;
  let x = (W - total) / 2; const y = mode ? 70 : 520; const h = mode ? 58 : 104;
  return ws.map(w => { const b = { x, y, w, h, size }; x += w + gap; return b; });
}
function drawChips(t, mode, state) {
  // state: [{active, strikeP, alpha}] per chip
  const A = chipBoxes(0), B = chipBoxes(1);
  CHIPS.forEach((s, i) => {
    const st = state[i]; if (st.alpha <= 0) return;
    const b = { x: lerp(A[i].x, B[i].x, mode), y: lerp(A[i].y, B[i].y, mode), w: lerp(A[i].w, B[i].w, mode), h: lerp(A[i].h, B[i].h, mode), size: lerp(A[i].size, B[i].size, mode) };
    const [bx, by] = boil(t, 300 + i, .6);
    ctx.save(); ctx.globalAlpha = st.alpha; ctx.translate(bx, by);
    card(b.x, b.y, b.w, b.h, 40 + i, st.active ? C.paper : C.paperDark, .45);
    font(Math.round(b.size), SERIF, 600); textC(s, b.x + b.w / 2, b.y + b.h * .66, C.ink, st.active || mode < 1 ? 1 : .7);
    strike(b.x + 10, b.y + b.h * .52, b.x + b.w - 10, b.y + b.h * .48, st.strikeP, 60 + i, mode ? 6 : 9);
    ctx.restore();
  });
}
// Which chips are struck by global time: filled in after the timeline is built.
let CHIP_STRIKE_T = [1e9, 1e9, 1e9, 1e9];
function chipState(T, active) { return CHIPS.map((_, i) => ({ active: i === active, alpha: 1, strikeP: ramp(T, CHIP_STRIKE_T[i], CHIP_STRIKE_T[i] + .7) })); }

const SHOTS = [
  // ===== SCENE 1 — COLD OPEN =====
  { id: 'dea', scene: 'Scene 1 — Cold open', pad: 1.2,
    lines: [
      "There's a page on the website of the Drug Enforcement Administration Museum, an institution of the United States federal government, and it says this.",
      "The earliest reference to opium growth and use is in 3400 B.C. when the opium poppy was cultivated in lower Mesopotamia. The Sumerians referred to it as Hul Gil, the 'joy plant.'",
    ],
    draw(t, S) {
      ctx.fillStyle = '#070606'; ctx.fillRect(0, 0, W, H);
      const q = '“The earliest reference to opium growth and use is in 3400 B.C. when the opium poppy was cultivated in lower Mesopotamia. The Sumerians referred to it as Hul Gil, the ‘joy plant.’”';

// Caption chunks: split lines at sentence ends and commas into chunks of ≤ 14 words.
function chunks(line) {
  line = line.replace(/B\.C\./g, 'B․C․'); // keep abbreviations whole
