<!doctype html>
<html><head><meta charset="utf-8"><title>Style Frames</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SERIF = '"EB Garamond", Georgia, serif';
const font = (px, w = 400, st = 'normal') => ctx.font = `${st} ${w}px/1 ${SERIF}`.replace(/(\d+)px\/1/, px + 'px');
function F(size, weight = 400, style = 'normal') { ctx.font = `${style} ${weight} ${size}px ${SERIF}`; }
function text(s, x, y, col, align = 'center', glow = 0) { ctx.save(); ctx.textAlign = align; ctx.fillStyle = col; if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; } ctx.fillText(s, x, y); ctx.restore(); }

const FRAMES = [
  // A — the sentence on the wall of a night archive hall; presenter looks up at it.
  t => {
    KIT.hall(ctx, t, 0);
    // projected quote on the back wall
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; KIT.glow(ctx, 900, 380, 700, 'rgba(255,215,160,A)', .18); ctx.restore();
    F(76); const l1 = 'The Sumerians referred to it as', l2 = 'Hul Gil, the “joy plant.”';
    text(l1, 900, 330, '#f3e3c4', 'center', 24); F(120, 500); text(l2, 900, 470, '#fff0d4', 'center', 30);
    const full = ctx.measureText(l2).width, pre = ctx.measureText('Hul Gil, the “').width, jp = ctx.measureText('joy plant').width, x0 = 900 - full / 2 + pre;
    KIT.strike(ctx, x0 - 14, 438, x0 + jp + 14, 430, 1, 7, 16);
    F(30, 400, 'italic'); text('— DEA Museum website', 900, 560, 'rgba(240,220,190,.6)');
    // presenter, foreground right, turned to the wall, pointing
    KIT.presenter(ctx, 1560, 1330, 1.25, t, { face: -1, head: -.12, look: -1, smile: .2, armF: [1.95, .2], armB: [-.08, .12], openF: true, rimSide: 1 });
    KIT.dust(ctx, t, 9, 60, [0, 0, 1920, 1080], .35);
    KIT.vignette(ctx, .8); KIT.filmGrain(ctx, t, .35);
  },
  // B — Uruk-period marsh at dusk. Giant "3400 B.C." struck across the sky.
  t => {
    KIT.marsh(ctx, t, 0);
    ctx.save(); ctx.globalAlpha = .9; F(300, 600); text('3400 B.C.', 1180, 330, 'rgba(255,236,205,.92)', 'center', 40); ctx.restore();
    KIT.strike(ctx, 720, 240, 1640, 222, 1, 3, 26);
    F(46, 400, 'italic'); text('Nothing written. Anywhere in Mesopotamia.', 1180, 430, '#fff1dc', 'center', 12);
    KIT.presenter(ctx, 470, 1230, 1.05, t, { face: 1, head: .05, look: 1, smile: .5, mouth: .35, armF: [1.75, .35], armB: [-.1, .15], openF: true });
    KIT.reedsFG(ctx, t, 0, 5);
    KIT.vignette(ctx, .7); KIT.filmGrain(ctx, t, .35);
  },
  // C — desert, golden hour. Presenter holds up the colocynth. The poppy lies struck in the sand.
  t => {
    KIT.desert(ctx, t, 0);
    ctx.save(); ctx.translate(1520, 960); ctx.rotate(-1.35); KIT.poppy(ctx, 0, 0, .8, 1); ctx.restore(); KIT.strike(ctx, 1330, 900, 1560, 930, 1, 11, 12);
    ctx.save(); ctx.translate(1500, 990); ctx.fillStyle = 'rgba(40,20,10,.35)'; ctx.beginPath(); ctx.ellipse(0, 0, 120, 16, 0, 0, 6.283); ctx.fill(); ctx.restore();
    F(150, 600); text('“joy plant”', 1330, 230, '#fff4dc', 'center', 30);
    KIT.strike(ctx, 1020, 196, 1650, 182, 1, 5, 20);
    F(58, 400, 'italic'); text('almost certainly… a stinking cucumber', 1330, 330, '#3a1d10');
    const hold = c => KIT.gourd(c, 20, -70, 1.05, t, 92, .2);
    KIT.presenter(ctx, 560, 1250, 1.1, t, { face: 1, head: -.08, look: .5, smile: .9, armF: [1.85, .55], armB: [-.1, .12], hold, rimSide: -1 });
    // botanical tag pinned near the gourd
    ctx.save(); ctx.translate(830, 470); ctx.rotate(-.05); ctx.fillStyle = '#efe4c8'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.fillRect(0, 0, 330, 70); ctx.shadowBlur = 0;
    F(34, 400, 'italic'); text('Citrullus colocynthis', 165, 46, '#2a211a'); ctx.restore();
    KIT.vignette(ctx, .6); KIT.filmGrain(ctx, t, .3);
  },
];
window.drawFrame = (i, t) => { ctx.clearRect(0, 0, 1920, 1080); FRAMES[i](t); return cv.toDataURL('image/jpeg', .92); };
window.ready = Promise.all(['400 40px "EB Garamond"', 'italic 400 40px "EB Garamond"', '600 40px "EB Garamond"', '500 40px "EB Garamond"'].map(f => document.fonts.load(f)));
</script></body></html>
